services:
  postgres:
    image: postgres:15
    container_name: secure-org-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_org_platform
      POSTGRES_USER: secure_org
      POSTGRES_PASSWORD: secure_org_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_org -d secure_org_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
