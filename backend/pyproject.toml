[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-org-platform-backend"
version = "0.1.0"
description = "Backend for the Secure Organization Management Platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx2",
    "ruff",
    "mypy",
]
